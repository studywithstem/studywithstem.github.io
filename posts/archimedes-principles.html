{t:'The answer is hidden in the Eureka story of Archimedes',p:"<b>Syracuse, about 250 BC.</b> King Hiero gave a goldsmith pure gold to make a crown. He suspected the goldsmith kept some gold and mixed in cheaper silver, but the crown must not be damaged. He asked Archimedes to find out.<br><br>Weight alone could not tell, and the crown's odd shape made its volume impossible to measure. Then, while stepping into a full bath, Archimedes noticed the water spilling over — <b>the spilled water had the same volume as the part of his body under water.</b><br><br>Gold is denser than silver, so a fake crown of the same mass has a bigger volume and pushes out more water. He ran home shouting <b>“Eureka!”</b>",eq:'Volume of water displaced = Volume of the body immersed',d:eureka},
